[project]
name = "openrater-server"
version = "0.1.0"
description = "API Lab — FastAPI service hosting the entity registry that Rate Lab consumes. Part of OpenRater."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenRater", email = "engineering@raterrisk.com" }]
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # Structured JSON logging. Used by openrater.observability + the
    # request-id middleware to thread correlation IDs through every
    # log line.
    "structlog>=24.1",
    # SQLite is stdlib; nothing else needed for v0 persistence.
    # Brief 47 — API Lab connectors.
    "httpx>=0.27",         # outbound connector HTTP calls.
    "python-dotenv>=1.0",  # load .env for local connector secrets.
    # E06 — encrypt connector API keys at rest (Fernet/AES) so an actuary can
    # set a key in the Connector Studio instead of editing the server's .env.
    "cryptography>=43.0",
    # Brief 86 R1 (ADR-0061) — Data Lab's read-only Postgres adapter. The
    # repo's first real PG client; imported LAZILY (a deployment that never
    # connects a warehouse never loads it), fail-closed with a named error
    # when absent. Same posture as the vault's `cryptography` ruling.
    "psycopg[binary]>=3.2",
    # Brief 92 (ADR-0065) — the deterministic workbook ingester reads
    # filing-transcription workbooks. Pure-Python, MIT. The parser is the
    # ONLY consumer; no other module may read xlsx.
    "openpyxl>=3.1",
]

# Brief 62.5 PR5 — the ONNX Tier-A adapter (the universal ML export target).
# OPTIONAL by design: GLM-coeff ingest stays zero-binary-deps; ONNX is
# imported LAZILY (only when an .onnx artifact is ingested/served), so a
# GLM-only deployment never pulls the runtime. Install with `[models]`.
[project.optional-dependencies]
models = [
    "onnxruntime>=1.18",  # pinned runtime; deterministic inference.
    "onnx>=1.16",         # graph inspection (nondeterministic-op gate) + fixtures.
    "numpy>=1.26",        # onnxruntime I/O.
    # Tier-B (Brief 62.5 PR5b) — native booster → ONNX convert-at-ingest.
    # All Apache-2.0 / MIT (OSS-clean). Parsed + converted ONLY inside the
    # sandbox; the serving path runs the converted ONNX (a pure function).
    "xgboost>=2.0",       # parse the native XGBoost booster (Apache-2.0).
    "lightgbm>=4.0",      # parse the native LightGBM booster (MIT).
    "onnxmltools>=1.12",  # booster → ONNX TreeEnsemble (Apache-2.0).
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",      # FastAPI TestClient
    "pyjwt[crypto]>=2.8",  # the deploy overlay's Access resolver — test_deploy_wire boots it in cloudflare mode
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrater"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W"]
# E501  → line length governed by `line-length` above; trailing-edge soft-warn
# B008  → FastAPI routes commonly use `payload: Model = Model()` to allow
#         empty-body POSTs; this is idiomatic and not a real bug
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# Make the src/ layout importable without relying on the editable
# install's .pth file (which macOS keeps re-flagging as UF_HIDDEN
# despite the dev.sh self-heal). With `pythonpath = ["src"]`, pytest
# resolves `openrater` directly from the source tree.
pythonpath = ["src"]
