# Builds and verifies the Claude Desktop extension on every supported
# platform. Trigger it manually for release candidates or by pushing a
# version tag. The normal `main` workflow owns source tests; this lane owns
# distributable artifacts.

name: desktop-build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows
      notary_skip:
        description: "1 = sign + verify only, skip the Apple submission"
        default: "0"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  mcpb-macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'windows'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # arm64
            label: darwin-arm64
          - os: macos-15-intel # x64 runner image
            label: darwin-x64
    runs-on: ${{ matrix.os }}
    # Allow time for the Apple notary queue while bounding stalled jobs.
    # 360 is the hosted-runner ceiling; the ~5h notary poll stays inside it,
    # and a poll that outlasts Apple keeps the artifact (see sign-macos.sh).
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: JS install
        run: pnpm install --frozen-lockfile

      - name: Python env
        run: uv sync --project server

      - name: Build the .mcpb
        shell: bash
        run: ./packaging/desktop/build-mcpb.sh

      - name: Sign + notarize
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_SKIP: ${{ inputs.notary_skip || '0' }}
        run: ./packaging/desktop/sign-macos.sh

      # Upload BEFORE the smoke test: a failed smoke must never discard a
      # signed (and possibly already-submitted) artifact — Apple's
      # acceptance attaches to these exact bytes retroactively.
      - uses: actions/upload-artifact@v4
        with:
          name: openrater-mcpb-${{ matrix.label }}
          path: packaging/desktop/dist/*.mcpb
          if-no-files-found: error

      - name: Smoke the packed artifact (unpack -> full MCP loop)
        shell: bash
        run: ./packaging/desktop/smoke-mcpb.sh

  mcpb-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    runs-on: windows-latest
    timeout-minutes: 90
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: JS install
        run: pnpm install --frozen-lockfile

      - name: Python env
        run: uv sync --project server

      - name: Build the .mcpb
        # Git Bash on the Windows runner runs the same POSIX script;
        # everything inside (node, pnpm, uv, PyInstaller) is portable.
        shell: bash
        run: ./packaging/desktop/build-mcpb.sh

      - name: Select unsigned Windows binaries
        id: windows-signing-files
        shell: powershell
        run: ./packaging/desktop/prepare-windows-signing.ps1

      - name: Azure login (passwordless)
        if: steps.windows-signing-files.outputs.has_unsigned == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows binaries
        if: steps.windows-signing-files.outputs.has_unsigned == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.windows-signing-files.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: OpenRater Claude Desktop Extension
          description-url: https://github.com/vadim-filimonov/openrater

      - name: Verify signatures + repack
        shell: powershell
        run: ./packaging/desktop/finish-windows-signing.ps1

      - name: Smoke the signed artifact (unpack -> full MCP loop)
        shell: bash
        run: ./packaging/desktop/smoke-mcpb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: openrater-mcpb-win32-x64
          path: packaging/desktop/dist/*.mcpb
          if-no-files-found: error
