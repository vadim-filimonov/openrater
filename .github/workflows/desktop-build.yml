# Builds and verifies the Claude Desktop extension on every supported
# platform. Trigger it manually for release candidates or by pushing a
# version tag. The normal `main` workflow owns source tests; this lane owns
# distributable artifacts.

name: desktop-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  mcpb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # arm64
            label: darwin-arm64
          - os: macos-15-intel # x64 runner image
            label: darwin-x64
          - os: windows-latest
            label: win32-x64
    runs-on: ${{ matrix.os }}
    # Bound stalled runners and unusually slow packaging jobs.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: JS install
        run: pnpm install --frozen-lockfile

      - name: Python env
        run: uv sync --project server

      - name: Build the .mcpb
        # Git Bash on the Windows runner runs the same POSIX script;
        # everything inside (node, pnpm, uv, PyInstaller) is portable.
        shell: bash
        run: ./packaging/desktop/build-mcpb.sh

      - name: Sign + notarize (macOS, secrets-gated — see SIGNING.md)
        # Release jobs use the configured Developer ID and notarization
        # secrets. Forks and local development can still produce unsigned
        # artifacts because the script exits cleanly when secrets are absent.
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./packaging/desktop/sign-macos.sh

      - name: Smoke the packed artifact (unpack → full MCP loop)
        shell: bash
        run: |
          set -e
          ART=$(ls packaging/desktop/dist/*.mcpb)
          EXTRACT="$RUNNER_TEMP/mcpb-extract"
          DATA="$RUNNER_TEMP/mcpb-data"
          unzip -q "$ART" -d "$EXTRACT"
          cd services/mcp
          MCP_ENTRY="$EXTRACT/mcp/index.mjs" \
          RATER_BUNDLE_ROOT="$EXTRACT" \
          RATER_DATA_DIR="$DATA" \
          RATER_SEED_COLD_TEST=0 \
          node scripts/demo-loop.mjs | tee /tmp/loop.log
          grep -q "premium=1898" /tmp/loop.log
          grep -q "P1 loop complete" /tmp/loop.log

      - uses: actions/upload-artifact@v4
        with:
          name: openrater-mcpb-${{ matrix.label }}
          path: packaging/desktop/dist/*.mcpb
          if-no-files-found: error
